<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Advanced Logic for Computer Science: Handbook">
    <title>Advanced Logic for Computer Science: Handbook</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --text-muted: #6c757d;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --border-color: #dee2e6;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary-color: #64b5f6;
            --primary-hover: #90caf9;
            --border-color: #333333;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header-text h1 {
            color: var(--text-color);
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
        }

        .header-text p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1rem;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            font-family: inherit;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        h2 {
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
            color: var(--text-color);
        }

        .lecture-list {
            list-style: none;
            padding: 0;
            display: grid;
            gap: 1rem;
        }

        .lecture-list li {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            overflow: hidden;
        }

        .lecture-list li:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-color);
        }

        .lecture-list a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
            display: block;
            padding: 1.5rem;
            transition: color 0.2s;
        }

        .lecture-list a:hover {
            color: var(--primary-color);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-container">
        <div class="header-text">
            <h1>Advanced Logic</h1>
            <p>Computer Science Handbook</p>
        </div>
        <button class="theme-toggle" id="themeToggle">
            <span class="icon">🌙</span>
            <span class="text">Dark Mode</span>
        </button>
    </div>
    
    <h2>Contents</h2>
    <ul class="lecture-list">
        <li>
            <a href="lecture-16.html">Lecture 16: Modal Logic, Language, Frames, Models, Truth</a>
        </li>
        <li>
            <a href="lecture-17.html">Lecture 17: n-step Truth, Submodels, Locality, Diagrams, Transitive Frames</a>
        </li>
        <li>
            <a href="lecture-18.html">Lecture 18: Clusters, Quotient Frames, Skeletons, Generated Subframes</a>
        </li>
    </ul>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const iconSpan = toggleBtn.querySelector('.icon');
        const textSpan = toggleBtn.querySelector('.text');
        
        // Check for saved theme preference or use system preference
        const getPreferredTheme = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                return savedTheme;
            }
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };

        const setTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'dark') {
                iconSpan.textContent = '☀️';
                textSpan.textContent = 'Light Mode';
            } else {
                iconSpan.textContent = '🌙';
                textSpan.textContent = 'Dark Mode';
            }
        };

        // Initialize theme
        setTheme(getPreferredTheme());

        // Toggle theme on click
        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });
    </script>
</body>
</html>
